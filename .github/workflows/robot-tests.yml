name: Run Robot Framework Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Permite execução manual pelo GitHub Actions UI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar dependências do Python
        run: pip install -r requirements-linux.txt

      - name: Instalar Homebrew
        run: |
          sudo apt update
          sudo apt install build-essential procps curl file git -y
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo >> /home/runner/.bashrc
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> /home/runner/.bashrc
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          sudo apt-get install build-essential
          brew install gcc
          brew --version
      - name: Add Homebrew to PATH
        run: echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Instalar Allure
        run: |
          sudo apt update
          brew install allure
          allure --version
      - name: Rodar testes com Robot Framework
        run: robot --listener allure_robotframework --outputdir results tests/

      - name: Gerar relatório Allure
        run: allure generate results/ -o allure-report --clean

      - name: Publicar relatório no GitHub Pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git checkout --orphan gh-pages
          git rm -rf .
          mv allure-report/* .
          git add .
          git commit -m "Atualizando relatório Allure"
          git push --force origin gh-pages
