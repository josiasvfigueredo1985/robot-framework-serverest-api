name: Run Robot Framework Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allure_available: ${{ steps.upload_pages.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Homebrew
        run: |
          sudo apt update
          sudo apt install -y build-essential procps curl file git
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          brew --version

      - name: Install Allure
        run: |
          brew install allure
          allure --version

      - name: Run tests with Robot Framework
        id: run_tests
        run: robotcode robot --listener allure_robotframework:output/allure --variable ENVIRONMENT_VAR:${QA_ENVIRONMENT} src/tests/

      - name: Generate Allure report
        id: allure_report
        if: ${{ !cancelled() && steps.run_tests.outcome != 'skipped' }}
        run: |
          if [ ! -d output/allure ] || ! find output/allure -name '*-result.json' -print -quit | grep -q .; then
            echo "No Allure test results were generated."
            exit 1
          fi
          allure generate --single-file output/allure -o allure-report --clean

      - name: Upload Allure report for GitHub Pages
        id: upload_pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.allure_report.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

  publish:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.allure_available == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summarize Allure report
        env:
          ALLURE_REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Test report" >> "$GITHUB_STEP_SUMMARY"
          echo "[View Allure report]($ALLURE_REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
