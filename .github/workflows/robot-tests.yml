name: Run Robot Framework Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Python dependencies
        run: pip install -r requirements-linux.txt

      - name: Install Homebrew
        run: |
          sudo apt update
          sudo apt install -y build-essential procps curl file git
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          brew --version

      - name: Install Allure
        run: |
          brew install allure
          allure --version

      - name: Run tests with Robot Framework
        run: robot --listener allure_robotframework --variable ENVIRONMENT:${ENVIRONMENT} --outputdir results src/tests/

      - name: Upload Robot Framework test artifacts
        uses: actions/upload-artifact@v2
        with:
          name: results
          path: |
            results/output.xml
            results/log.html
            results/report.html

      - name: Send report to commit
        uses: joonvena/robotframework-reporter-action@v2.5
        with:
          gh_access_token: ${{ secrets.GH_ACCESS_TOKEN }}
          name: robot-results
          path: results

      - name: Generate Allure report
        run: |
          allure generate --single-file output/allure -o allure-report --clean

      - name: Publish report to GitHub Pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git checkout --orphan gh-pages
          git rm -rf .
          mv allure-report/* .
          git add .
          git commit -m "Updating Allure report"
          git push --force origin gh-pages
