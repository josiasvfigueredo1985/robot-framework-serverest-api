name: Run Robot Framework Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Permite execução manual pelo GitHub Actions UI

jobs:
  run-tests:
    runs-on: ubuntu-latest # Runner do GitHub Actions
    env:
      ENVIRONMENT: ${{ vars.ENVIRONMENT }} # Variável de ambiente

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Baixa o código do repositório

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # Versão do Python que suporta Robot

      - name: Install dependencies
        run: |
          pip install -r requirements-linux.txt  # Install project dependencies.
      - name: Run Robot Framework tests
        run: |
          robot --variable ENVIRONMENT:${ENVIRONMENT} --listener allure_robotframework  --outputdir results src/tests/

      - name: Upload test results
        if: always() # Assure that logs are sent even in fail.
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: results/

      - name: Gerar relatório HTML do Allure
        run: |
          allure generate output/allure -o allure-report --clean
      - name: Deploy do relatório no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
