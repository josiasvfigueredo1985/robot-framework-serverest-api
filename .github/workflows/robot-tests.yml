name: Run Robot Framework Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Homebrew
        run: |
          sudo apt update
          sudo apt install -y build-essential procps curl file git
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          brew --version

      - name: Install Allure
        run: |
          brew install allure
          allure --version

      - name: Run tests with Robot Framework
        id: run_tests
        run: robotcode robot --listener allure_robotframework:output/allure --variable ENVIRONMENT_VAR:${QA_ENVIRONMENT} src/tests/

      - name: Upload Robot Framework test report artifacts
        id: upload_robot_report
        if: ${{ !cancelled() && steps.run_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4.6.0
        with:
          name: robot reports
          path: |
            reports

      - name: Generate Summary Tests Results
        uses: joonvena/robotframework-reporter-action@v2.5
        with:
          gh_access_token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Generate Allure report
        id: allure_report
        if: ${{ !cancelled() && steps.run_tests.outcome != 'skipped' }}
        run: |
          if [ ! -d output/allure ] || ! find output/allure -name '*-result.json' -print -quit | grep -q .; then
            echo "No Allure test results were generated."
            exit 1
          fi
          allure generate --single-file output/allure -o allure-report --clean

      - name: Upload Robot Framework Allure report test artifacts
        id: upload_allure_report
        if: ${{ !cancelled() && steps.allure_report.outcome == 'success' }}
        uses: actions/upload-artifact@v4.6.0
        with:
            name: allure report
            path: |
                  allure-report

      - name: Summarize test reports
        if: ${{ !cancelled() && steps.run_tests.outcome != 'skipped' }}
        env:
          ROBOT_REPORT_URL: ${{ steps.upload_robot_report.outputs.artifact-url }}
          ALLURE_REPORT_URL: ${{ steps.upload_allure_report.outputs.artifact-url }}
        run: |
          {
            echo "## Test reports"
            if [ -n "$ROBOT_REPORT_URL" ]; then
              echo "- [Robot Framework report]($ROBOT_REPORT_URL)"
            else
              echo "- Robot Framework report unavailable."
            fi
            if [ -n "$ALLURE_REPORT_URL" ]; then
              echo "- [Allure report]($ALLURE_REPORT_URL)"
            else
              echo "- Allure report unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to GitHub gh-pages branch
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git checkout --orphan gh-pages
          git rm -rf .
          git add .
          git commit -m "Updating Allure report"
          git push --force origin gh-pages
